<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" href="https://drive.google.com/thumbnail?id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90&sz=w64" type="image/x-icon">

    <style>
        :root { --main-bg: #f8f9fa; --primary-color: #002060; --accent-color: #92D050; --qc-header: #e9f5e1; }
        html { font-size: 16px; }
        body { background-color: var(--main-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 1rem; color: var(--primary-color); }
        .hidden { display: none !important; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,32,96,0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; }
        .navbar { background-color: var(--primary-color) !important; border-bottom: 4px solid var(--accent-color); position: sticky; top: 0; z-index: 1040; }
        .navbar-brand img { background: white; padding: 4px; border-radius: 4px; }
        .nav-actions { display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; align-items: center; }
        .nav-actions::-webkit-scrollbar { display: none; }
        .nav-actions .btn { min-width: max-content; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        .table-responsive { max-height: 65vh; overflow-y: auto; overflow-x: auto; width: 100%; border-radius: 8px; border: 1px solid #dee2e6; }
        th { position: sticky; top: 0; background-color: var(--primary-color) !important; color: white !important; z-index: 10; font-size: 0.875rem; white-space: nowrap; }
        td { font-size: 0.875rem; white-space: nowrap; vertical-align: middle; }
        .card-header { background-color: var(--primary-color); color: white; }
        .form-control, .form-select, .btn { min-height: 44px; }
        input[readonly].locked-field { background-color: #e9ecef !important; cursor: not-allowed; color: var(--primary-color); font-weight: 600; border: 1px dashed #adb5bd; }
        .btn-accent { background-color: var(--accent-color) !important; color: var(--primary-color) !important; font-weight: bold; border: none; }
        .btn-accent:hover { background-color: #7ebd45 !important; color: white !important; }
        .summary-card { border-left: 5px solid var(--primary-color); border-radius: 8px; }
        .toast-container { z-index: 1055; pointer-events: none; }
        .toast { pointer-events: auto; }
        @media (max-width: 768px) { #dtForm .btn-submit { width: 100% !important; margin-bottom: 8px; } }
        #map { border-radius: 8px; border: 1px solid #ccc; z-index: 1; height: 250px; width: 100%; cursor: default !important; }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay hidden">
        <div id="loader-spinner" class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: var(--accent-color);" role="status"></div>
        <h5 id="loader-text" class="fw-bold text-center px-3">Processing...</h5>
        <div id="loader-fallback" class="mt-4 hidden text-center w-100 px-3" style="max-width: 500px;"></div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toastMessage">Message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div id="loginView" style="max-width: 400px; margin: 10vh auto; padding: 0 15px;">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4 text-center">
                <img src="https://drive.google.com/uc?export=view&id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90" onerror="this.src='https://drive.google.com/thumbnail?id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90&sz=w400'" alt="Company Logo" class="img-fluid mb-4" style="max-height: 80px; width: auto; max-width: 100%;">
                <h4 class="mb-4 fw-bold" style="color: var(--primary-color) !important;">Login Portal</h4>
                <form id="loginForm">
                    <div class="mb-3 text-start">
                        <label for="loginEmpCode" class="form-label text-muted small fw-bold">Employee Code</label>
                        <input type="text" id="loginEmpCode" class="form-control" required autocomplete="username">
                    </div>
                    <div class="mb-4 text-start">
                        <label for="loginPassword" class="form-label text-muted small fw-bold">Password</label>
                        <div class="input-group">
                            <input type="password" id="loginPassword" class="form-control" required autocomplete="current-password" style="border-right: none;">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password" style="min-width: 44px; display: flex; align-items: center; justify-content: center; background: white; border-color: #dee2e6;">
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn w-100 text-white" style="background-color: var(--primary-color); font-weight: bold;">Login</button>
                </form>
            </div>
        </div>
    </div>

    <div id="appView" class="hidden">
        <nav class="navbar navbar-dark shadow-sm">
            <div class="container-fluid d-flex flex-nowrap align-items-center">
                <a class="navbar-brand d-flex align-items-center fw-bold me-3" href="#">
                    <img src="https://drive.google.com/uc?export=view&id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90" onerror="this.src='https://drive.google.com/thumbnail?id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90&sz=w100'" height="35" class="me-2" alt="Logo">
                    Portal
                </a>
                <div class="ms-auto nav-actions">
                    <span id="syncBadge" class="badge bg-warning text-dark me-2 hidden fw-bold" style="font-size: 0.9rem;"></span>
                    <span class="text-light me-3 small fw-bold" id="userDisplay"></span>
                    <button id="navUser" class="btn btn-sm btn-outline-light me-2 hidden fw-bold px-3 py-2" onclick="switchView('viewUser')">Form Entry</button>
                    <button id="navQC" class="btn btn-sm btn-warning me-2 fw-bold hidden px-3 py-2" style="background-color: var(--accent-color); border-color: var(--accent-color); color: var(--primary-color);" onclick="switchView('viewQC'); loadQC(1);">QC Panel</button>
                    <button class="btn btn-sm btn-outline-light fw-bold px-3 py-2" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-3 py-4">
            
            <div id="viewUser" class="hidden" style="max-width: 900px; margin: 0 auto;">
                <div id="surveyorFailedAlert" class="alert alert-danger fw-bold hidden" role="alert"></div>

                <div class="card shadow-sm border-0">
                    <div class="card-header d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">New Survey</h5>
                        <button type="button" class="btn btn-sm btn-accent shadow-sm" onclick="loadSavedHierarchy()">Load Last Config</button>
                    </div>
                    <div class="card-body p-3 p-md-4">
                        <form id="dtForm">
                            <h6 class="fw-bold mb-3 border-bottom pb-2" style="color: var(--primary-color);">Location Hierarchy</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-3"><label for="f_zone" class="small text-muted fw-bold">Zone</label><select id="f_zone" class="form-select cascade-trigger"><option value="">Select</option></select></div>
                                <div class="col-12 col-md-3"><label for="f_circle" class="small text-muted fw-bold">Circle</label><select id="f_circle" class="form-select cascade-trigger"><option value="">Select</option></select></div>
                                <div class="col-12 col-md-3"><label for="f_division" class="small text-muted fw-bold">Division</label><select id="f_division" class="form-select cascade-trigger"><option value="">Select</option></select></div>
                                <div class="col-12 col-md-3"><label for="f_subdiv" class="small text-muted fw-bold">Sub Division</label><select id="f_subdiv" class="form-select cascade-trigger"><option value="">Select</option></select></div>
                                <div class="col-12 col-md-6"><label for="f_subname" class="small text-muted fw-bold">Substation Name</label><select id="f_subname" class="form-select cascade-trigger"><option value="">Select</option></select></div>
                                <div class="col-12 col-md-6"><label for="f_subcode" class="small text-muted fw-bold">Substation Code</label><input type="text" id="f_subcode" class="form-control locked-field" placeholder="Auto-fills" readonly></div>
                                <div class="col-12 col-md-4"><label for="f_feedername" class="small text-muted fw-bold">Feeder Name</label><select id="f_feedername" class="form-select cascade-trigger"><option value="">Select</option></select></div>
                                <div class="col-12 col-md-4"><label for="f_feedercode" class="small text-muted fw-bold">Feeder Code</label><input type="text" id="f_feedercode" class="form-control locked-field" placeholder="Auto-fills" readonly></div>
                                <div class="col-12 col-md-4"><label for="f_qrcode" class="small text-muted fw-bold">New Meter QR Code</label><input type="text" id="f_qrcode" class="form-control locked-field" placeholder="Auto-fills" readonly></div>
                            </div>
                            
                            <h6 class="fw-bold mb-3 border-bottom pb-2" style="color: var(--primary-color);">Asset Details</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-4">
                                    <label for="f_metertype" class="small text-muted fw-bold">Meter Type</label>
                                    <select id="f_metertype" class="form-select"><option value="">Select</option></select>
                                </div>
                                <div class="col-12 col-md-4" id="div_capacity">
                                    <label for="f_capacity" class="small text-muted fw-bold">DTR Capacity (KVA)</label>
                                    <select id="f_capacity" class="form-select"><option value="">Select</option></select>
                                </div>
                                <div class="col-12 col-md-4" id="div_status">
                                    <label for="f_status" class="small text-muted fw-bold">Installation Status</label>
                                    <select id="f_status" class="form-select"><option value="">Select</option></select>
                                </div>
                                
                                <div class="col-12 col-md-4 form-dt-only"><label class="small text-muted fw-bold">DT Name</label><input type="text" id="f_dtName" class="form-control" placeholder="Optional"></div>
                                <div class="col-12 col-md-4 form-dt-only"><label class="small text-muted fw-bold">DT Box Number</label><input type="text" id="f_dtBoxNumber" class="form-control" placeholder="Optional"></div>
                                <div class="col-12 col-md-4 form-dt-only"><label class="small text-muted fw-bold">DT Box Seal Number</label><input type="text" id="f_dtBoxSealNumber" class="form-control" placeholder="Optional"></div>
                                
                                <div class="col-12 col-md-4 form-feeder-only hidden"><label class="small text-muted fw-bold">Feeder PT Capacity</label><input type="text" id="f_feederPtCapacity" class="form-control" placeholder="Optional"></div>
                                <div class="col-12 col-md-4 form-feeder-only hidden"><label class="small text-muted fw-bold">Feeder MF</label><input type="text" id="f_feederMf" class="form-control" placeholder="Optional"></div>

                                <div class="col-12 col-md-6 form-dt-only" id="div_meternumber">
                                    <label for="f_meternumber" class="small text-muted fw-bold">New Meter Number</label>
                                    <input type="text" id="f_meternumber" class="form-control" placeholder="e.g. AB12345678" maxlength="11" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text">
                                    <small class="text-muted d-block mt-1" style="font-size: 11px;">2 letters + 7 to 9 digits (max 11)</small>
                                    <span id="meterNoMsg" class="hidden"></span>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="f_latlong" class="small text-muted fw-bold">Latitude, Longitude <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="text" id="f_latlong" class="form-control locked-field" placeholder="Waiting for GPS..." readonly>
                                        <button type="button" class="btn btn-outline-secondary fw-bold" onclick="startGPS()">Retry GPS</button>
                                    </div>
                                    <small class="text-muted" style="font-size: 11px;">Captures automatically via Live Map.</small>
                                </div>
                                
                                <div class="col-12">
                                    <label class="small text-muted fw-bold">Live GPS Map</label>
                                    <div id="map"></div>
                                    <div id="gpsStatus" class="small mt-1 fw-bold text-primary">Initializing GPS Map...</div>
                                </div>
                            </div>
                            
                            <h6 class="fw-bold mb-3 border-bottom pb-2" style="color: var(--primary-color);">Attachments</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="f_meterImg" class="small text-muted fw-bold">Meter Image <span class="text-danger">*</span></label>
                                    <input type="file" id="f_meterImg" class="form-control" accept="image/*" capture="environment">
                                    <img id="prev_meterImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="f_meterDtImg" class="small text-muted fw-bold">Meter with DT Image <span class="text-danger">*</span></label>
                                    <input type="file" id="f_meterDtImg" class="form-control" accept="image/*" capture="environment">
                                    <img id="prev_meterDtImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                                <div class="col-12 col-md-6 form-feeder-only hidden">
                                    <label for="f_feederPtImg" class="small text-muted fw-bold">Feeder PT Photo</label>
                                    <input type="file" id="f_feederPtImg" class="form-control" accept="image/*" capture="environment">
                                    <img id="prev_feederPtImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                                <div class="col-12 col-md-6 form-dt-only">
                                    <label for="f_dtBoxMarkImg" class="small text-muted fw-bold">DT Box Marking Photo</label>
                                    <input type="file" id="f_dtBoxMarkImg" class="form-control" accept="image/*" capture="environment">
                                    <img id="prev_dtBoxMarkImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                                <div class="col-12 col-md-6 form-dt-only">
                                    <label for="f_dtBoxSealImg" class="small text-muted fw-bold">DT Box Seal Photo</label>
                                    <input type="file" id="f_dtBoxSealImg" class="form-control" accept="image/*" capture="environment">
                                    <img id="prev_dtBoxSealImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                                <div class="col-12 col-md-6 form-dt-only">
                                    <label for="f_dtMeterPingImg" class="small text-muted fw-bold">DT Meter Ping Screenshot</label>
                                    <input type="file" id="f_dtMeterPingImg" class="form-control" accept="image/*">
                                    <img id="prev_dtMeterPingImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                                <div class="col-12 col-md-6 form-dt-only">
                                    <label for="f_jointVisitSldImg" class="small text-muted fw-bold">Joint Visit SLD Photo</label>
                                    <input type="file" id="f_jointVisitSldImg" class="form-control" accept="image/*" capture="environment">
                                    <img id="prev_jointVisitSldImg" class="img-thumbnail mt-2 hidden" style="max-height: 100px;">
                                </div>
                            </div>

                            <button type="submit" id="btnSubmitSurvey" class="btn btn-lg btn-submit btn-accent shadow-sm mt-3 w-100">Submit Final Survey</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow-lg">
                        <div class="modal-header text-white" style="background-color: var(--primary-color);">
                            <h5 class="modal-title fw-bold">Review before submitting</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body bg-light" id="confirmModalBody"></div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Edit</button>
                            <button type="button" class="btn btn-accent px-4 fw-bold" id="btnFinalSubmit">Confirm and Submit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="viewQC" class="hidden" style="width: 100%; margin: 0 auto;">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                    <h4 class="qc-title mb-2 mb-md-0" style="color: var(--primary-color);">🛡️ QC Dashboard</h4>
                </div>
                
                <div class="card shadow-sm border-0 bg-white">
                    <div class="card-body p-3">
                        <div class="row g-2 mb-4">
                            <div class="col-12 col-md-2"><label class="small text-muted fw-bold">Zone</label><select id="qc_zone" class="form-select"><option value="ALL">All Zones</option></select></div>
                            <div class="col-12 col-md-2"><label class="small text-muted fw-bold">Circle</label><select id="qc_circle" class="form-select"><option value="ALL">All Circles</option></select></div>
                            <div class="col-12 col-md-2"><label class="small text-muted fw-bold">Division</label><select id="qc_division" class="form-select"><option value="ALL">All Divisions</option></select></div>
                            <div class="col-12 col-md-2"><label class="small text-muted fw-bold">Sub Div</label><select id="qc_subdiv" class="form-select"><option value="ALL">All Sub Divs</option></select></div>
                            <div class="col-12 col-md-2"><label class="small text-muted fw-bold">From Date</label><input type="date" id="qc_fromDate" class="form-control"></div>
                            <div class="col-12 col-md-2"><label class="small text-muted fw-bold">To Date</label><input type="date" id="qc_toDate" class="form-control"></div>
                            <div class="col-12 mt-2 text-end">
                                <button class="btn px-4 btn-outline-secondary me-2" onclick="resetQCFilters()">Reset</button>
                                <button class="btn px-4 text-white" style="background-color: var(--primary-color);" onclick="loadQC(1)">Apply Filters</button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover qc-table mb-0">
                                <thead><tr><th>Feeder Info</th><th>Submitted By</th><th>Date</th><th>Action</th></tr></thead>
                                <tbody id="qcTableBody"></tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span id="qcPagingInfo" class="small text-muted fw-bold"></span>
                            <div>
                                <button class="btn btn-sm btn-outline-primary" id="btnQCPrev" onclick="changeQCPage(-1)">Previous</button>
                                <button class="btn btn-sm btn-outline-primary ms-1" id="btnQCNext" onclick="changeQCPage(1)">Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="qcModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content border-0 shadow-lg">
                        <div class="modal-header text-white" style="background-color: var(--primary-color);">
                            <h5 class="modal-title fw-bold">Review Submission Details</h5>
                            <button type="button" class="btn-close btn-close-white" id="fallbackModalClose" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body bg-light p-4" id="qcModalContent"></div>
                        <div class="modal-footer" style="background-color: #f1f3f5;">
                            <input type="text" id="qcRejectReason" class="form-control mb-2 hidden" placeholder="Enter reason for rejection (Required)">
                            <div class="w-100 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-secondary fw-bold" id="btnFallbackCloseModal" data-bs-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-danger px-4 fw-bold" id="btnRejectQC">Reject</button>
                                <button type="button" class="btn btn-accent px-4 fw-bold" id="btnApproveQC">Approve</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxMWpuMr1cbob1qPcl69cuJ9ezEbXLzkWoeuAsZu2e8sLP8p39D3mgP5UwXpchyZx7GTA/exec';
let sessionToken = null; let currentUser = null; let masterDropdownData = []; let rawQCData = []; let activeQCRowIdx = null; 
let qcCurrentPage = 1; let map, marker; let currentLat = null, currentLng = null, currentAcc = null; let watchId = null;
let duplicateCheckTimer; let currentCheckReqId = 0; let isMeterDuplicate = false; let isMeterDuplicateChecked = false;
const METER_REGEX = /^[A-Z]{2}[0-9]{7,9}$/;

document.getElementById('togglePassword').addEventListener('click', function() {
    const pwdInput = document.getElementById('loginPassword'); const eyeIcon = document.getElementById('eyeIcon');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text'; this.setAttribute('aria-label', 'Hide password');
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        pwdInput.type = 'password'; this.setAttribute('aria-label', 'Show password');
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
});

function showLoader(text="Processing...") { document.getElementById('loader-text').innerText = text; document.getElementById('loader-fallback').classList.add('hidden'); document.getElementById('loader-spinner').classList.remove('hidden'); document.getElementById('loader').classList.remove('hidden'); }
function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

function generateUUID() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); }

const DB_NAME = 'PortalOfflineDB'; const STORE_NAME = 'syncQueue'; const DB_VERSION = 2; let localDB = null; let isSyncing = false;
function getDB() { return new Promise((resolve, reject) => { if (!window.indexedDB) return reject(new Error("IndexedDB is not supported.")); if (localDB) return resolve(localDB); const request = indexedDB.open(DB_NAME, DB_VERSION); request.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'reqId' }); }; request.onsuccess = (e) => { localDB = e.target.result; localDB.onversionchange = () => { localDB.close(); localDB = null; }; localDB.onclose = () => { localDB = null; }; resolve(localDB); }; request.onerror = (e) => reject(new Error(e.target.error?.message)); request.onblocked = () => reject(new Error("Database blocked")); }); }
async function saveToQueue(payload) { const db = await getDB(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); tx.oncomplete = () => resolve(); tx.onerror = () => reject(new Error(tx.error?.name)); tx.objectStore(STORE_NAME).put(payload); }); }
async function getQueue() { const db = await getDB(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readonly'); const req = tx.objectStore(STORE_NAME).getAll(); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(new Error(tx.error?.name)); }); }
async function removeFromQueue(reqId) { const db = await getDB(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); tx.oncomplete = () => resolve(); tx.onerror = () => reject(new Error(tx.error?.name)); tx.objectStore(STORE_NAME).delete(reqId); }); }
function updateSyncBadge(count) { const badge = document.getElementById('syncBadge'); if (!badge) return; if (count > 0) { badge.classList.remove('hidden'); badge.innerText = `⏳ ${count} Pending Upload(s)`; } else { badge.classList.add('hidden'); } }

async function processSyncQueue() {
    if (isSyncing) return;
    try {
        const queue = await getQueue(); updateSyncBadge(queue.length);
        if (queue.length === 0) return;
        isSyncing = true;
        for (const item of queue) {
            try { await apiCall(item, 0, true); await removeFromQueue(item.reqId); } catch (e) { if (e.isServerError) { showToast(`Sync failed permanently: ${e.message}`, true); await removeFromQueue(item.reqId); } else { break; } }
        }
    } catch (dbErr) { } finally { isSyncing = false; try { const finalQueue = await getQueue(); updateSyncBadge(finalQueue.length); } catch(e) {} }
}
setInterval(processSyncQueue, 15000);

async function apiCall(payload, retries = 1, silent = false) {
    if (sessionToken) payload.token = sessionToken;
    const attempt = async () => {
        const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 60000); 
        try {
            const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', body: JSON.stringify(payload), signal: controller.signal });
            clearTimeout(timeoutId);
            if (!res.ok) throw new Error(`HTTP Error: ${res.status} ${res.statusText}`);
            const rawText = await res.text(); let json;
            try { json = JSON.parse(rawText); } catch (parseErr) { throw new Error("Invalid payload format."); }
            if (json.status !== 'success') { const err = new Error(json.message || "Unknown server error"); err.isServerError = true; throw err; }
            return json.data;
        } catch (err) { clearTimeout(timeoutId); if (err.name === 'AbortError') throw new Error("Request timed out. Check network."); throw err; }
    };
    try { return await attempt(); } catch (err) { if (retries > 0 && !err.isServerError && !err.message.includes("Invalid credentials")) { return await apiCall(payload, retries - 1, silent); } if (!silent) showToast(err.message, true); throw err; }
}

    } else {
        document.getElementById('navQC').classList.add('hidden'); document.getElementById('navUser').classList.remove('hidden');
        try {
            await getDB().catch(e => console.warn("Offline DB disabled")); processSyncQueue(); 
            showLoader("Initializing Device..."); await new Promise(resolve => setTimeout(resolve, 300));
            showLoader("Fetching Form Data…"); await initializeApp(); showLoader("Checking Sync Status...");

                <div class="text-danger mb-3 fw-bold bg-white p-3 rounded shadow-sm text-start" style="word-wrap: break-word; font-size: 0.9rem;"><b>Error:</b> ${err.message}</div>

function getUnique(data, colIndex, filterFn = () => true) { if (!data || !Array.isArray(data) || data.length === 0) return []; const set = new Set(); data.filter(filterFn).forEach(row => { if(row[colIndex]) set.add(String(row[colIndex]).trim()); }); return Array.from(set).sort(); }
function populateDropdown(id, list, addAll=false) { const el = document.getElementById(id); if(el) el.innerHTML = (addAll ? '<option value="ALL">ALL</option>' : '<option value="">Select</option>') + list.map(v => `<option value="${v}">${v}</option>`).join(''); }

function setupCascading(prefix, includeAllOption) {
    const triggers = ['zone', 'circle', 'division', 'subdiv', 'subname']; if (prefix === 'f') triggers.push('feedername'); 
    populateDropdown(`${prefix}_zone`, getUnique(masterDropdownData, 0), includeAllOption);
    triggers.forEach((key, idx) => {
        const el = document.getElementById(`${prefix}_${key}`); if(!el) return;
        el.addEventListener('change', () => {
            const rowFilter = (r) => {
                let match = true; for(let i=0; i<=idx; i++) { const elVal = document.getElementById(`${prefix}_${triggers[i]}`).value; const sheetCol = i === 4 ? 4 : (i === 5 ? 6 : i); if(elVal && elVal !== 'ALL' && String(r[sheetCol]).toLowerCase() !== String(elVal).toLowerCase()) match = false; }
                return match;
            };
            if (idx + 1 < triggers.length) {
                for(let i=idx+1; i<triggers.length; i++) { const child = document.getElementById(`${prefix}_${triggers[i]}`); if(child) child.innerHTML = includeAllOption ? '<option value="ALL">ALL</option>' : '<option value="">Select</option>'; }
                const nextId = `${prefix}_${triggers[idx+1]}`; const nextSheetCol = (idx + 1) === 4 ? 4 : ((idx + 1) === 5 ? 6 : (idx + 1)); 
                if(document.getElementById(nextId)) populateDropdown(nextId, getUnique(masterDropdownData, nextSheetCol, rowFilter), includeAllOption);
                if (prefix === 'f') { if (idx < 4) document.getElementById('f_subcode').value = ''; if (idx < 5) { document.getElementById('f_feedercode').value = ''; document.getElementById('f_qrcode').value = ''; } }
            }
            if(prefix === 'f') {
                if(key === 'subname') { const row = masterDropdownData.find(rowFilter); document.getElementById('f_subcode').value = row ? row[5] : 'Not Found'; }
                if(key === 'feedername') { const row = masterDropdownData.find(rowFilter); document.getElementById('f_feedercode').value = row ? row[7] : 'Not Found'; document.getElementById('f_qrcode').value = row ? row[8] : 'Not Found'; }
            }
        });
    });
}

function initMap() { if(!map) { const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }); map = L.map('map', { zoomControl: true, dragging: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false, layers: [osm] }).setView([20.5937, 78.9629], 5); } }
function startGPS() {
    initMap(); if (navigator.geolocation) {
        document.getElementById('gpsStatus').innerHTML = "<span class='text-primary'>Locating...</span>"; document.getElementById('f_latlong').value = "Locating..."; if (watchId) navigator.geolocation.clearWatch(watchId);
        const fallbackTimeout = setTimeout(() => { document.getElementById('gpsStatus').innerHTML = "<span class='text-warning'>Trying coarse location...</span>"; navigator.geolocation.getCurrentPosition(updateLocationSuccess, updateLocationError, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }); }, 15000);
        watchId = navigator.geolocation.watchPosition((p) => { clearTimeout(fallbackTimeout); updateLocationSuccess(p); }, (err) => { clearTimeout(fallbackTimeout); document.getElementById('gpsStatus').innerHTML = "<span class='text-warning'>Trying coarse location...</span>"; navigator.geolocation.getCurrentPosition(updateLocationSuccess, updateLocationError, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    } else { document.getElementById('gpsStatus').innerHTML = "<span class='text-danger'>Geolocation not supported on this device.</span>"; }
}
function updateLocationSuccess(p) { currentLat = p.coords.latitude; currentLng = p.coords.longitude; currentAcc = p.coords.accuracy; document.getElementById('f_latlong').value = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`; document.getElementById('gpsStatus').innerHTML = `<span class="text-muted" style="font-size: 11px;">±${Math.round(currentAcc)} m</span>`; const latlng = [currentLat, currentLng]; map.setView(latlng, 18); if(!marker) marker = L.marker(latlng, { interactive: false }).addTo(map); else marker.setLatLng(latlng); }
function updateLocationError(err) { document.getElementById('f_latlong').value = ""; document.getElementById('gpsStatus').innerHTML = `<span class="text-danger">GPS Error: ${err.message}. <button type="button" class="btn btn-sm btn-link p-0 fw-bold" onclick="startGPS()">Retry</button></span>`; }

function processImage(file, latLongStr) {
    return new Promise((resolve, reject) => {
        if (!file) { resolve(""); return; }
        const img = new Image(); img.onload = () => {
            const canvas = document.createElement('canvas'); let w = img.naturalWidth; let h = img.naturalHeight;
            const MAX_AREA = 16777216; if ((w * h) > MAX_AREA) { const scaleDown = Math.sqrt(MAX_AREA / (w * h)); w = Math.floor(w * scaleDown); h = Math.floor(h * scaleDown); }
            canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
            const minEdge = Math.min(w, h); let fontSize = Math.max(24, Math.floor(minEdge * 0.03));
            const localDate = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
            const lines = [`GPS: ${latLongStr || 'Missing'}`, `Date: ${localDate}`]; ctx.font = `bold ${fontSize}px sans-serif`;
            const padding = Math.floor(fontSize * 0.5); const lineSpace = Math.floor(fontSize * 0.2); let maxWidth = 0;
            lines.forEach(line => { let mw = ctx.measureText(line).width; if(mw > maxWidth) maxWidth = mw; });
            if (maxWidth + (padding * 2) > w) { fontSize = Math.floor((w - (padding * 2)) / (maxWidth / fontSize)); ctx.font = `bold ${fontSize}px sans-serif`; maxWidth = 0; lines.forEach(line => { let mw = ctx.measureText(line).width; if(mw > maxWidth) maxWidth = mw; }); }
            const boxWidth = maxWidth + (padding * 2); const boxHeight = (lines.length * fontSize) + ((lines.length - 1) * lineSpace) + (padding * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(padding, h - boxHeight - padding, boxWidth, boxHeight); ctx.fillStyle = '#92D050'; ctx.textBaseline = 'top';
            let currY = h - boxHeight - padding + padding; lines.forEach(line => { ctx.fillText(line, padding + padding, currY); currY += (fontSize + lineSpace); });
            resolve(canvas.toDataURL('image/jpeg', 1.0)); URL.revokeObjectURL(img.src);
        }; img.onerror = () => { reject("Image load failed"); URL.revokeObjectURL(img.src); }; img.src = URL.createObjectURL(file);
    });
}

document.getElementById('f_meternumber').addEventListener('input', function(e) {
    const raw = this.value; const cleaned = raw.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (raw !== cleaned) this.value = cleaned; 
    const val = this.value; const msgEl = document.getElementById('meterNoMsg'); isMeterDuplicate = false; isMeterDuplicateChecked = false;
    const isFeeder = document.getElementById('f_metertype').value.toLowerCase() === 'feeder'; const isNotInstalled = document.getElementById('f_status').value.trim().toLowerCase() === 'not installed';
    if (!val || isFeeder || isNotInstalled) { msgEl.className = 'hidden'; return; }
    if (!METER_REGEX.test(val)) { msgEl.className = 'small text-danger fw-bold mt-1 d-block'; let reason = "Length must be 9 to 11 chars."; if (val.length >= 2 && !/^[A-Z]{2}/.test(val)) reason = "Must start with 2 letters."; else if (val.length > 2 && /[^0-9]/.test(val.substring(2))) reason = "Only digits allowed after first 2 letters."; msgEl.innerText = `❌ Invalid: ${reason}`; return; }
    msgEl.className = 'small text-secondary fw-bold mt-1 d-block'; msgEl.innerText = '✅ Format valid. Checking availability...';
    clearTimeout(duplicateCheckTimer); const checkId = ++currentCheckReqId;
    duplicateCheckTimer = setTimeout(async () => {
        const q = await getQueue().catch(()=>[]); if (q.find(i => i.meterNumber === val)) { isMeterDuplicate = true; isMeterDuplicateChecked = true; msgEl.className = 'small text-danger fw-bold mt-1 d-block'; msgEl.innerText = '❌ Already exists in your offline queue.'; return; }
        try { const res = await apiCall({ action: 'checkDuplicate', meterNumber: val }, 0, true); if (currentCheckReqId !== checkId) return; isMeterDuplicateChecked = true; if (res.exists) { isMeterDuplicate = true; msgEl.className = 'small text-danger fw-bold mt-1 d-block'; msgEl.innerText = `❌ Duplicate: Exists (UID: ${res.uid}, by ${res.surveyor}, on ${res.date})`; } else { isMeterDuplicate = false; msgEl.className = 'small text-success fw-bold mt-1 d-block'; msgEl.innerText = '✅ Meter number is available!'; } } catch(err) { if (currentCheckReqId !== checkId) return; msgEl.className = 'small text-warning fw-bold mt-1 d-block'; msgEl.innerText = '⚠️ Cannot verify offline (local checks passed).'; isMeterDuplicate = false; isMeterDuplicateChecked = true; }
    }, 500);
});

function validateForm() {
    let errors = []; const isFeeder = document.getElementById('f_metertype').value.toLowerCase() === 'feeder'; const isNotInstalled = document.getElementById('f_status').value.trim().toLowerCase() === 'not installed';
    ['f_zone', 'f_circle', 'f_division', 'f_subdiv', 'f_subname', 'f_metertype'].forEach(id => { if(!document.getElementById(id).value) errors.push(document.querySelector(`label[for="${id}"]`).innerText.replace('*', '').trim() + " is required."); });
    if(isFeeder && !document.getElementById('f_feedername').value) errors.push("Feeder Name is required.");
    if (!isFeeder) { if(!document.getElementById('f_capacity').value) errors.push("DTR Capacity is required."); if(!document.getElementById('f_status').value) errors.push("Installation Status is required."); if (!isNotInstalled) { const mn = document.getElementById('f_meternumber').value; if(!mn) errors.push("New Meter Number is required."); else if(!METER_REGEX.test(mn)) errors.push("Meter Number format invalid."); else if(isMeterDuplicate) errors.push("Meter Number is a duplicate."); else if(!isMeterDuplicateChecked) errors.push("Still verifying Meter Number availability, please wait."); } }
    if (!currentLat || !currentLng) errors.push("Live GPS coordinates are missing.");
    if (!document.getElementById('f_meterImg').files[0]) errors.push("Meter Image is required.");
    if (!document.getElementById('f_meterDtImg').files[0]) errors.push("Meter with DT Image is required.");

}

async function executeSubmit() {
    const submitBtn = document.getElementById('btnSubmitSurvey'); submitBtn.disabled = true; submitBtn.innerText = "Processing...";
    try {
        showLoader("Preparing submission..."); const finalLatLong = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`; showLoader("Processing images...");
        const img1Base64 = await processImage(document.getElementById('f_meterImg').files[0], finalLatLong);
        const img2Base64 = await processImage(document.getElementById('f_meterDtImg').files[0], finalLatLong);
        const p_feederPt = await processImage(document.getElementById('f_feederPtImg').files[0], finalLatLong);
        const p_dtMark = await processImage(document.getElementById('f_dtBoxMarkImg').files[0], finalLatLong);
        const p_dtSeal = await processImage(document.getElementById('f_dtBoxSealImg').files[0], finalLatLong);
        const p_dtPing = await processImage(document.getElementById('f_dtMeterPingImg').files[0], finalLatLong);
        const p_sld = await processImage(document.getElementById('f_jointVisitSldImg').files[0], finalLatLong);
        
        const isFeeder = document.getElementById('f_metertype').value.toLowerCase() === 'feeder'; const isNotInstalled = document.getElementById('f_status').value.trim().toLowerCase() === 'not installed';
        
        const payload = {
            action: 'submit', reqId: generateUUID(),
            zone: document.getElementById('f_zone').value, circle: document.getElementById('f_circle').value, division: document.getElementById('f_division').value, subdiv: document.getElementById('f_subdiv').value, subName: document.getElementById('f_subname').value, subCode: document.getElementById('f_subcode').value, feederName: document.getElementById('f_feedername').value, feederCode: document.getElementById('f_feedercode').value, qrCode: document.getElementById('f_qrcode').value, meterType: document.getElementById('f_metertype').value,
            dtrCapacity: document.getElementById('f_capacity').disabled ? "" : document.getElementById('f_capacity').value, meterNumber: (isFeeder || isNotInstalled) ? "" : document.getElementById('f_meternumber').value, installStatus: document.getElementById('f_status').disabled ? "" : document.getElementById('f_status').value, 
            latLong: finalLatLong, meterImageBase64: img1Base64, meterDtImageBase64: img2Base64,
            feederPtCapacity: isFeeder ? document.getElementById('f_feederPtCapacity').value : "", feederMf: isFeeder ? document.getElementById('f_feederMf').value : "",
            dtName: !isFeeder ? document.getElementById('f_dtName').value : "", dtBoxNumber: !isFeeder ? document.getElementById('f_dtBoxNumber').value : "", dtBoxSealNumber: !isFeeder ? document.getElementById('f_dtBoxSealNumber').value : "",
            feederPtImgStr: p_feederPt, dtBoxMarkImgStr: p_dtMark, dtBoxSealImgStr: p_dtSeal, dtMeterPingImgStr: p_dtPing, jointVisitSldImgStr: p_sld
        };
        
        let savedLocally = false; submitBtn.innerText = "Saving locally..."; showLoader("Saving locally...");
        try { await saveToQueue(payload); savedLocally = true; } catch (localErr) { submitBtn.innerText = "Uploading directly..."; showToast("Offline disabled. Uploading directly...", true); showLoader("Uploading to server..."); try { await apiCall(payload, 0); savedLocally = true; } catch (serverErr) { throw new Error("Could not save locally AND server rejected it: " + serverErr.message); } }
        if (savedLocally) { saveHierarchyToStorage(); resetEntireForm(); processSyncQueue(); }
    } catch(err) { showToast(err.message, true); } finally { submitBtn.disabled = false; submitBtn.innerText = "Submit Final Survey"; hideLoader(); }
}

function resetEntireForm() {
    document.getElementById('dtForm').reset();
    ['f_circle', 'f_division', 'f_subdiv', 'f_subname', 'f_feedername'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = '<option value="">Select</option>'; });
    ['f_subcode', 'f_feedercode', 'f_qrcode'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
    ['f_dtName', 'f_dtBoxNumber', 'f_dtBoxSealNumber', 'f_feederPtCapacity', 'f_feederMf', 'f_meterImg', 'f_meterDtImg', 'f_feederPtImg', 'f_dtBoxMarkImg', 'f_dtBoxSealImg', 'f_dtMeterPingImg', 'f_jointVisitSldImg'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    ['meterImg', 'meterDtImg', 'feederPtImg', 'dtBoxMarkImg', 'dtBoxSealImg', 'dtMeterPingImg', 'jointVisitSldImg'].forEach(id => { const el = document.getElementById('prev_' + id); if(el) { el.classList.add('hidden'); el.src = ''; } });
    document.getElementById('meterNoMsg').className = 'hidden'; isMeterDuplicate = false; isMeterDuplicateChecked = false;
    document.getElementById('f_metertype').dispatchEvent(new Event('change')); document.getElementById('f_status').dispatchEvent(new Event('change'));
    showToast("Submitted successfully, form cleared."); window.scrollTo({top: 0, behavior: 'smooth'}); 
}

async function loadQC(page = 1) {
    qcCurrentPage = page; showLoader("Loading QC Data...");
    try {
        const filters = { zone: document.getElementById('qc_zone').value, circle: document.getElementById('qc_circle').value, division: document.getElementById('qc_division').value, subdiv: document.getElementById('qc_subdiv').value, fromDate: document.getElementById('qc_fromDate').value, toDate: document.getElementById('qc_toDate').value };
        const res = await apiCall({ action: 'getQCData', page: qcCurrentPage, limit: 50, filters: filters });
        rawQCData = res.data || []; const tbody = document.getElementById('qcTableBody'); tbody.innerHTML = '';
        if(rawQCData.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="text-center fw-bold py-4 text-muted">No pending items found.</td></tr>'; } else { rawQCData.forEach((row, idx) => { const tr = document.createElement('tr'); tr.innerHTML = `<td><b>${row.subName || 'Unknown'}</b><br><small class="text-muted">${row.feederName || 'N/A'}</small></td><td>${row.surveyor}<br><small class="text-muted">${row.empCode}</small></td><td>${new Date(row.date).toLocaleDateString()}</td><td><button class="btn btn-sm btn-primary fw-bold px-3" onclick="openQCModal(${idx})">Review</button></td>`; tbody.appendChild(tr); }); }
        document.getElementById('qcPagingInfo').innerText = `Page ${res.page} (Total: ${res.total})`; document.getElementById('btnQCPrev').disabled = (res.page === 1); document.getElementById('btnQCNext').disabled = (rawQCData.length < 50);
    } catch(err) { showToast(err.message, true); } hideLoader();
}

function changeQCPage(dir) { loadQC(qcCurrentPage + dir); }
function resetQCFilters() { ['qc_zone', 'qc_circle', 'qc_division', 'qc_subdiv', 'qc_fromDate', 'qc_toDate'].forEach(id => { const el = document.getElementById(id); if(el) el.value = el.tagName === 'SELECT' ? 'ALL' : ''; }); loadQC(1); }

function openQCModal(idx) {
    activeQCRowIdx = idx; const data = rawQCData[idx]; const isFeeder = data.meterType === 'Feeder';
    document.getElementById('qcModalContent').innerHTML = `
        <div class="row">
            <div class="col-md-5 mb-3">
                <h6 class="fw-bold border-bottom pb-2">Edit Details</h6>
                <label class="small fw-bold">Meter No:</label><input type="text" id="qc_meterNumber" class="form-control mb-2" value="${data.meterNumber || ''}" ${isFeeder ? 'readonly' : ''}>
                <div class="${isFeeder ? '' : 'hidden'}"><label class="small fw-bold">Feeder PT Capacity:</label><input type="text" id="qc_feederPtCapacity" class="form-control mb-2" value="${data.feederPtCapacity || ''}"><label class="small fw-bold">Feeder MF:</label><input type="text" id="qc_feederMf" class="form-control mb-2" value="${data.feederMf || ''}"></div>
                <div class="${isFeeder ? 'hidden' : ''}"><label class="small fw-bold">DT Name:</label><input type="text" id="qc_dtName" class="form-control mb-2" value="${data.dtName || ''}"><label class="small fw-bold">DT Box No:</label><input type="text" id="qc_dtBoxNumber" class="form-control mb-2" value="${data.dtBoxNumber || ''}"><label class="small fw-bold">DT Box Seal No:</label><input type="text" id="qc_dtBoxSealNumber" class="form-control mb-2" value="${data.dtBoxSealNumber || ''}"></div>
            </div>
            <div class="col-md-7 mb-3 border-start">
                <h6 class="fw-bold border-bottom pb-2">Image Gallery</h6>
                <div class="row g-2" id="qcGallery"></div>
            </div>
        </div>
    `;
    const gallery = document.getElementById('qcGallery'); const imgs = { "Meter": data.meterImgId, "Meter DT": data.meterDtImgId, "Feeder PT": isFeeder ? data.feederPtImgId : null, "Marking": !isFeeder ? data.dtBoxMarkingImgId : null, "Seal": !isFeeder ? data.dtBoxSealImgId : null, "Ping": !isFeeder ? data.dtMeterPingImgId : null, "SLD": data.jointVisitSldImgId };
    for (const [title, id] of Object.entries(imgs)) { if (!id) continue; const div = document.createElement('div'); div.className = 'col-6'; const img = document.createElement('img'); img.className = 'img-fluid border rounded shadow-sm w-100 mb-1'; img.style.cssText = 'height:120px; object-fit:cover; cursor:pointer;'; img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w2000'; img.onclick = () => window.open('https://drive.google.com/uc?id=' + id, '_blank'); apiCall({ action: 'getImageBase64', fileId: id }).then(res => { if(res) img.src = res; }).catch(e => {}); const lbl = document.createElement('div'); lbl.className = 'small fw-bold text-center'; lbl.innerText = title; div.appendChild(img); div.appendChild(lbl); gallery.appendChild(div); }
    document.getElementById('qcRejectReason').classList.remove('hidden'); document.getElementById('qcRejectReason').value = '';
    
    const footer = document.querySelector('#qcModal .modal-footer .w-100');
    if(!document.getElementById('btnDeleteQC')) { const btnDel = document.createElement('button'); btnDel.id = 'btnDeleteQC'; btnDel.className = 'btn btn-danger px-4 fw-bold me-auto'; btnDel.innerText = 'Delete'; footer.insertBefore(btnDel, footer.children[1]); }
    
    document.getElementById('btnApproveQC').replaceWith(document.getElementById('btnApproveQC').cloneNode(true)); document.getElementById('btnRejectQC').replaceWith(document.getElementById('btnRejectQC').cloneNode(true)); document.getElementById('btnDeleteQC').replaceWith(document.getElementById('btnDeleteQC').cloneNode(true));
    
    document.getElementById('btnApproveQC').onclick = () => submitQCAction('Approved');
    document.getElementById('btnRejectQC').onclick = () => submitQCAction('Rejected', document.getElementById('qcRejectReason').value);
    document.getElementById('btnDeleteQC').onclick = () => { if(!confirm('Permanently Delete this record and move images to trash?')) return; const reason = document.getElementById('qcRejectReason').value; if(!reason) return showToast("Reason required for deletion.", true); apiCall({ action: 'deleteRecord', uid: data.uid, reqId: data.reqId, reason: reason }).then(res => { showToast("Deleted."); bootstrap.Modal.getInstance(document.getElementById('qcModal')).hide(); loadQC(qcCurrentPage); }).catch(e => showToast(e.message, true)); };
    new bootstrap.Modal(document.getElementById('qcModal')).show();
}

async function submitQCAction(status, reason = '') {
    if (status === 'Rejected' && (!reason || reason.trim().length < 3)) return showToast("A rejection reason is required.", true);
    const data = rawQCData[activeQCRowIdx]; showLoader(`Marking as ${status}...`);
    try { const manual = { meterNumber: document.getElementById('qc_meterNumber').value, dtName: document.getElementById('qc_dtName')?.value, dtBoxNumber: document.getElementById('qc_dtBoxNumber')?.value, dtBoxSealNumber: document.getElementById('qc_dtBoxSealNumber')?.value, feederPtCapacity: document.getElementById('qc_feederPtCapacity')?.value, feederMf: document.getElementById('qc_feederMf')?.value }; await apiCall({ action: 'submitQC', uid: data.uid, status: status, reason: reason, updatedManual: manual }); showToast(`Submission successfully ${status}!`); bootstrap.Modal.getInstance(document.getElementById('qcModal')).hide(); loadQC(qcCurrentPage); } catch(err) { showToast(err.message, true); } hideLoader();
}
</script>
