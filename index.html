<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-bg: #f8f9fa; --primary-color: #002060; --accent-color: #92D050; }
        body { background-color: var(--main-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,32,96,0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; flex-direction: column; }
        
        /* BRANDING RESTORED */
        .navbar { background-color: var(--primary-color) !important; border-bottom: 4px solid var(--accent-color); position: sticky; top: 0; z-index: 1040; }
        .brand-box { background: white; padding: 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
        .brand-box img { max-height: 35px; width: auto; }
        
        /* GENERAL UI */
        .locked-field { background-color: #e9ecef !important; cursor: not-allowed; font-weight: 600; border: 1px dashed #adb5bd; }
        .btn-accent { background-color: var(--accent-color) !important; color: var(--primary-color) !important; font-weight: bold; border: none; }
        #map { height: 250px; width: 100%; border-radius: 8px; border: 1px solid #ccc; }
        
        /* QC MODAL UI */
        .gallery-img { max-height: 200px; max-width:100%; object-fit: contain; cursor: pointer; border-radius:4px; }
        .img-wrapper { position: relative; display: inline-block; text-align: center; border: 1px solid #ddd; padding: 5px; background: white; border-radius: 5px; width:100%; margin-bottom: 15px;}
        .img-label { font-size: 12px; font-weight: bold; margin-top: 5px; color: var(--primary-color); }
        .qc-modal-lg { max-width: 95%; }
        .modal-body { max-height: calc(100vh - 160px); overflow-y: auto; }
        .modal-footer { position: sticky; bottom: 0; background-color: #fff; border-top: 1px solid #dee2e6; z-index: 10; padding: 1rem; }
    </style>
</head>
<body>

    <script>
        // Globally accessible UUID Generator
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
    </script>

    <div id="loader" class="loading-overlay hidden">
        <div class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: var(--accent-color);" role="status"></div>
        <h5 class="fw-bold text-center px-3">Processing...</h5>
    </div>

    <!-- Login View -->
    <div id="loginView" style="max-width: 400px; margin: 10vh auto; padding: 0 15px;">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4 text-center">
                <div class="brand-box mb-4 shadow-sm" style="padding:10px;">
                    <img src="https://drive.google.com/thumbnail?id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90&sz=w400" alt="IntelliSmart Logo">
                </div>
                <h4 class="mb-4 fw-bold" style="color: var(--primary-color);">Login Portal</h4>
                <form id="loginForm">
                    <input type="text" id="loginEmpCode" class="form-control mb-3" placeholder="Employee Code" required>
                    <input type="password" id="loginPassword" class="form-control mb-4" placeholder="Password" required>
                    <button type="submit" class="btn w-100 text-white" style="background-color: var(--primary-color); font-weight: bold;">Login</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App View -->
    <div id="appView" class="hidden">
        <nav class="navbar navbar-dark shadow-sm">
            <div class="container-fluid d-flex flex-nowrap align-items-center">
                <a class="navbar-brand fw-bold me-3 d-flex align-items-center" href="#">
                    <div class="brand-box me-2">
                        <img src="https://drive.google.com/thumbnail?id=1y8y6Iu1dTfHJwQ_L96en0SBCNZUoTa90&sz=w100" alt="IntelliSmart">
                    </div>
                    Portal
                </a>
                <div class="ms-auto d-flex align-items-center">
                    <span class="text-light me-3 small fw-bold" id="userDisplay"></span>
                    <button id="navUser" class="btn btn-sm btn-outline-light me-2 hidden fw-bold" onclick="switchView('viewUser')">Form Entry</button>
                    <button id="navQC" class="btn btn-sm btn-warning me-2 fw-bold hidden" onclick="switchView('viewQC'); loadQC(1);">QC Panel</button>
                    <button class="btn btn-sm btn-outline-light fw-bold" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>

        <!-- FORM ENTRY VIEW -->
        <div id="viewUser" class="hidden container py-4" style="max-width: 900px; margin: 0 auto;">
            <div class="card shadow-sm border-0">
                <div class="card-header d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 fw-bold">New Survey</h5>
                </div>
                <div class="card-body p-3 p-md-4">
                    <form id="dtForm">
                        <h6 class="fw-bold mb-3 border-bottom pb-2" style="color: var(--primary-color);">Location Hierarchy</h6>
                        <div class="row g-3 mb-4">
                            <!-- Basic setup for location fields (simplified here to focus on logic, add options via JS) -->
                            <div class="col-12 col-md-4"><label class="small text-muted fw-bold">Zone</label><select id="f_zone" class="form-select"></select></div>
                            <div class="col-12 col-md-4"><label class="small text-muted fw-bold">Circle</label><select id="f_circle" class="form-select"></select></div>
                            <div class="col-12 col-md-4"><label class="small text-muted fw-bold">Division</label><select id="f_division" class="form-select"></select></div>
                            <div class="col-12 col-md-6"><label class="small text-muted fw-bold">Sub Div</label><select id="f_subdiv" class="form-select"></select></div>
                            <div class="col-12 col-md-6"><label class="small text-muted fw-bold">Feeder Name</label><input type="text" id="f_feedername" class="form-control"></div>
                        </div>
                        
                        <h6 class="fw-bold mb-3 border-bottom pb-2" style="color: var(--primary-color);">Asset Details</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-4">
                                <label class="small text-muted fw-bold">Meter Type <span class="text-danger">*</span></label>
                                <select id="f_metertype" class="form-select" onchange="applyFormMeterTypeRules()" required>
                                    <option value="">Select</option>
                                    <option value="DT">DT</option>
                                    <option value="Feeder">Feeder</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="small text-muted fw-bold">Latitude, Longitude <span class="text-danger">*</span></label>
                                <input type="text" id="f_latlong" class="form-control locked-field" readonly>
                            </div>
                            <div class="col-12 col-md-4" id="div_meternumber">
                                <label class="small text-muted fw-bold">New Meter Number <span class="text-danger">*</span></label>
                                <input type="text" id="f_meternumber" class="form-control" placeholder="AB12345678" maxlength="11">
                            </div>
                        </div>

                        <!-- DYNAMIC FIELDS BASED ON METER TYPE -->
                        <div class="row g-3 mb-4">
                            <!-- Feeder Only -->
                            <div class="col-12 col-md-4 form-feeder-only"><label class="small text-muted fw-bold">Feeder PT Capacity</label><input type="text" id="f_feederPtCapacity" class="form-control"></div>
                            <div class="col-12 col-md-4 form-feeder-only"><label class="small text-muted fw-bold">Feeder MF</label><input type="text" id="f_feederMf" class="form-control"></div>
                            
                            <!-- DT Only -->
                            <div class="col-12 col-md-4 form-dt-only"><label class="small text-muted fw-bold">DT Name</label><input type="text" id="f_dtName" class="form-control"></div>
                            <div class="col-12 col-md-4 form-dt-only"><label class="small text-muted fw-bold">DT Box Number</label><input type="text" id="f_dtBoxNumber" class="form-control"></div>
                            <div class="col-12 col-md-4 form-dt-only"><label class="small text-muted fw-bold">DT Box Seal Number</label><input type="text" id="f_dtBoxSealNumber" class="form-control"></div>
                        </div>

                        <button type="submit" class="btn btn-lg btn-submit btn-accent shadow w-100">Submit Survey</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- QC DASHBOARD & MODAL -->
        <div id="viewQC" class="container-fluid px-3 py-4 hidden">
            <h4 class="fw-bold text-primary mb-3">🛡️ QC Dashboard</h4>
            
            <div class="table-responsive bg-white shadow-sm">
                <table class="table table-hover table-bordered mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Req ID</th><th>UID</th><th>Surveyor</th><th>Meter No</th><th>Zone</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="qcTableBody">
                        <tr><td colspan="6" class="text-center">No pending items...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- TASK 5: ENLARGED QC MODAL -->
            <div class="modal fade" id="qcModal" tabindex="-1" data-bs-backdrop="static">
                <div class="modal-dialog qc-modal-lg modal-dialog-centered modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title fw-bold">Review & Edit Submission</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body bg-light">
                            <input type="hidden" id="qc_uid">
                            <input type="hidden" id="qc_reqId">
                            
                            <div class="row">
                                <div class="col-md-5">
                                    <h6 class="fw-bold border-bottom pb-2 text-primary">Verified Manual Edits</h6>
                                    <div class="row g-2">
                                        <div class="col-12 col-md-6">
                                            <label class="small fw-bold">Meter Number</label>
                                            <input type="text" id="qc_meterNumber" class="form-control" style="border: 2px solid #ffc107;">
                                        </div>
                                        
                                        <!-- TASK 5: Feeder Fields -->
                                        <div class="col-12 col-md-6 qc-feeder-field">
                                            <label class="small fw-bold">Feeder PT Capacity</label>
                                            <input type="text" id="qc_feederPtCapacity" class="form-control">
                                        </div>
                                        <div class="col-12 col-md-6 qc-feeder-field">
                                            <label class="small fw-bold">Feeder MF</label>
                                            <input type="text" id="qc_feederMf" class="form-control">
                                        </div>

                                        <!-- TASK 5: DT Fields -->
                                        <div class="col-12 col-md-6 qc-dt-field">
                                            <label class="small fw-bold">DT Name</label>
                                            <input type="text" id="qc_dtName" class="form-control">
                                        </div>
                                        <div class="col-12 col-md-6 qc-dt-field">
                                            <label class="small fw-bold">DT Box Number</label>
                                            <input type="text" id="qc_dtBoxNumber" class="form-control">
                                        </div>
                                        <div class="col-12 col-md-6 qc-dt-field">
                                            <label class="small fw-bold">DT Box Seal Number</label>
                                            <input type="text" id="qc_dtBoxSealNumber" class="form-control">
                                        </div>

                                        <!-- Universal -->
                                        <div class="col-12">
                                            <label class="small fw-bold">Any Remark</label>
                                            <input type="text" id="qc_anyRemark" class="form-control">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-7">
                                    <h6 class="fw-bold border-bottom pb-2 text-primary">Images Gallery</h6>
                                    <div id="qcGallery" class="row g-2"></div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer d-flex flex-wrap bg-white">
                            <input type="text" id="qc_rejectReason" class="form-control mb-2 w-100" placeholder="Enter required reason for rejection or deletion">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-warning fw-bold text-dark" onclick="submitQCAction('Rejected')">Reject</button>
                            <!-- TASK 3: Added Delete Button -->
                            <button type="button" class="btn btn-danger fw-bold ms-auto me-auto" onclick="deleteQCAction()">Delete</button>
                            <button type="button" class="btn btn-success fw-bold ms-auto" onclick="submitQCAction('Approved')">Approve (Save Edits)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API Handler Wrapper
        function fetchBackend(payload) {
            return new Promise((resolve, reject) => {
                const token = localStorage.getItem('dt_token');
                if(token) payload.token = token;
                google.script.run.withSuccessHandler(res => {
                    const parsed = JSON.parse(res);
                    if(parsed.status === 'success') resolve(parsed); else reject(parsed.message);
                }).withFailureHandler(reject).doPost({ postData: { contents: JSON.stringify(payload) }});
            });
        }

        // View Router
        function switchView(viewId) {
            document.querySelectorAll('#appView > div').forEach(div => {
                if (div.id && (div.id.startsWith('view') || div.id === 'appView')) {
                    div.classList.add('hidden');
                }
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('dt_token');
            localStorage.removeItem('dt_role');
            document.getElementById('appView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        // Login Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loader').classList.remove('hidden');
            const code = document.getElementById('loginEmpCode').value;
            const pass = document.getElementById('loginPassword').value;

            fetchBackend({ action: 'login', empCode: code, password: pass }).then(res => {
                localStorage.setItem('dt_token', res.data.token);
                localStorage.setItem('dt_role', res.data.role);
                document.getElementById('userDisplay').innerText = `Hello, ${res.data.name}`;
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appView').classList.remove('hidden');
                
                if (String(res.data.role).toLowerCase() === 'qc') {
                    document.getElementById('navQC').classList.remove('hidden');
                    switchView('viewQC');
                    loadQC(1);
                } else {
                    document.getElementById('navUser').classList.remove('hidden');
                    switchView('viewUser');
                }
            }).catch(err => alert("Login Failed: " + err))
              .finally(() => document.getElementById('loader').classList.add('hidden'));
        });

        // Form Rules
        function applyFormMeterTypeRules() {
            const isFeeder = document.getElementById('f_metertype').value === 'Feeder';
            if (isFeeder) {
                document.getElementById('f_meternumber').value = 'N/A';
                document.getElementById('f_meternumber').readOnly = true;
                document.querySelectorAll('.form-dt-only').forEach(e => e.style.display = 'none');
                document.querySelectorAll('.form-feeder-only').forEach(e => e.style.display = 'block');
            } else {
                document.getElementById('f_meternumber').value = '';
                document.getElementById('f_meternumber').readOnly = false;
                document.querySelectorAll('.form-feeder-only').forEach(e => e.style.display = 'none');
                document.querySelectorAll('.form-dt-only').forEach(e => e.style.display = 'block');
            }
        }

        // --- QC MODULE ---
        let currentQCData = [];

        function loadQC(page) {
            document.getElementById('loader').classList.remove('hidden');
            fetchBackend({ action: 'getQCData', page: page, limit: 50 }).then(res => {
                currentQCData = res.data.data;
                const tbody = document.getElementById('qcTableBody');
                tbody.innerHTML = '';
                if(currentQCData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No pending items.</td></tr>';
                    return;
                }
                currentQCData.forEach((row, i) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.reqId}</td>
                        <td>${row.uid}</td>
                        <td>${row.surveyor}</td>
                        <td>${row.newMeterNumber || 'N/A'}</td>
                        <td>${row.zone || ''}</td>
                        <td><button class="btn btn-sm btn-primary fw-bold" onclick="openQCModalFromIndex(${i})">Review</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }).catch(e => alert(e)).finally(() => document.getElementById('loader').classList.add('hidden'));
        }

        function openQCModalFromIndex(index) { openQCModal(currentQCData[index]); }

        // TASK 5: HIDE/SHOW LOGIC IN MODAL
        function openQCModal(data) {
            document.getElementById('qc_uid').value = data.uid;
            document.getElementById('qc_reqId').value = data.reqId;
            document.getElementById('qc_meterNumber').value = data.newMeterNumber || '';
            document.getElementById('qc_feederPtCapacity').value = data.feederPtCapacity || '';
            document.getElementById('qc_dtName').value = data.dtName || '';
            document.getElementById('qc_rejectReason').value = '';

            const isFeeder = (data.meterType && data.meterType.toLowerCase() === 'feeder');
            
            if (isFeeder) {
                document.getElementById('qc_meterNumber').value = 'N/A';
                document.getElementById('qc_meterNumber').readOnly = true;
                document.querySelectorAll('.qc-dt-field').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.qc-feeder-field').forEach(el => el.classList.remove('hidden'));
            } else {
                document.getElementById('qc_meterNumber').readOnly = false;
                document.querySelectorAll('.qc-feeder-field').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.qc-dt-field').forEach(el => el.classList.remove('hidden'));
            }

            const images = {
                "Meter Image": data.meterImgId,
                "Meter with DT": data.meterDtImgId,
                "Feeder PT Photo": isFeeder ? data.feederPtImgId : null,
                "DT Box Marking": !isFeeder ? data.dtBoxMarkingImgId : null,
                "DT Box Seal": !isFeeder ? data.dtBoxSealImgId : null,
                "Joint Visit SLD": data.jointVisitSldImgId
            };
            loadQCImages(images);
            new bootstrap.Modal(document.getElementById('qcModal')).show();
        }

        // TASK 4: FIX 404 IMAGES (Bypass Drive UI via Base64 Fetch)
        function loadQCImages(imageObj) {
            const gallery = document.getElementById('qcGallery');
            gallery.innerHTML = '';
            for (const [title, id] of Object.entries(imageObj)) {
                if (!id || id === 'undefined') continue;
                
                const col = document.createElement('div'); col.className = 'col-6 col-md-4';
                const wrapper = document.createElement('div'); wrapper.className = 'img-wrapper';
                
                const img = document.createElement('img');
                img.className = 'gallery-img w-100';
                img.alt = title;
                img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><text x="10" y="50" font-family="sans-serif" font-size="12">Loading...</text></svg>';
                
                img.onerror = function() {
                    this.onerror = null;
                    this.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w2000'; // Fallback
                };

                const label = document.createElement('div');
                label.className = 'img-label text-truncate'; label.innerText = title;

                wrapper.appendChild(img); wrapper.appendChild(label); col.appendChild(wrapper); gallery.appendChild(col);

                // API Call for Base64 injection
                fetchBackend({ action: 'getImageBase64', fileId: id }).then(res => {
                    if(res && res.data) img.src = res.data;
                }).catch(err => { img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w2000'; });
            }
        }

        // TASK 3: DELETE FRONTEND ACTION
        function deleteQCAction() {
            const reason = document.getElementById('qc_rejectReason').value.trim();
            if(!reason) return alert("A reason is required to Delete.");
            if(!confirm("Are you SURE you want to completely delete this record? Images will be moved to trash and the Meter Number will be freed.")) return;
            
            const btns = document.querySelectorAll('.modal-footer .btn');
            btns.forEach(b => b.disabled = true);
            
            const payload = {
                action: 'deleteRecord',
                uid: document.getElementById('qc_uid').value,
                reqId: document.getElementById('qc_reqId').value,
                reason: reason
            };
            
            fetchBackend(payload).then(res => {
                alert("Deleted successfully!");
                bootstrap.Modal.getInstance(document.getElementById('qcModal')).hide();
                loadQC(1); // Reload list
            }).catch(e => alert(e)).finally(() => btns.forEach(b => b.disabled = false));
        }

        function submitQCAction(status) {
            const reason = document.getElementById('qc_rejectReason').value.trim();
            if(status === 'Rejected' && !reason) return alert("A reason is required to Reject.");
            
            const btns = document.querySelectorAll('.modal-footer .btn');
            btns.forEach(b => b.disabled = true);

            const payload = {
                action: 'submitQC',
                uid: document.getElementById('qc_uid').value,
                status: status,
                reason: reason,
                updatedManual: {
                    meterNumber: document.getElementById('qc_meterNumber').value,
                    feederPtCapacity: document.getElementById('qc_feederPtCapacity').value,
                    dtName: document.getElementById('qc_dtName').value
                }
            };

            fetchBackend(payload).then(res => {
                alert("Status Updated!");
                bootstrap.Modal.getInstance(document.getElementById('qcModal')).hide();
                loadQC(1);
            }).catch(e => alert(e)).finally(() => btns.forEach(b => b.disabled = false));
        }
    </script>
</body>
</html>
